name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - staging        # Run tests + deploy staging on staging branch
  release:
    types: [created]    # Run production deploy on release/tag created

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}   # So 'app' module can be found
        run: |
          pytest tests/

  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'   # Only on pushes to staging branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your real deploy commands here, for example:
          # scp files to staging server
          # ssh user@staging-server "systemctl restart my-flask-app"
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  deploy-production:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')  # Only on tag release creation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your real production deploy commands here, for example:
          # ssh user@production-server "docker pull myapp:latest && docker-compose up -d"
        env:
          PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
